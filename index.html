<html lang="id"><head><meta charset="utf-8">

<style>

*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx)}
button,input,select,textarea{font:inherit;color:inherit}
.btn{background:var(--pr);color:#fff;border:0;border-radius:20px;padding:7px 14px;cursor:pointer}
.btn.s{background:var(--bd);color:var(--tx)}.btn.d{background:#e0536b}
input,select,textarea{width:100%;padding:8px;border:2px solid var(--bd);border-radius:12px;background:var(--card);margin:3px 0 8px}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#ffd9a8,#ffb3a1)}
.box{background:var(--card);border-radius:28px;padding:28px;max-width:340px;width:92%;text-align:center;box-shadow:0 10px 30px #0002}
.mascot{font-size:56px;animation:b 1.5s infinite}@keyframes b{50%{transform:translateY(-10px)}}
#app{display:none;min-height:100vh}
nav{position:fixed;inset:0 auto 0 0;width:210px;background:var(--card);padding:10px;overflow:auto;border-right:2px solid var(--bd)}
nav .lg{text-align:center;font-weight:700;margin-bottom:8px}nav img{max-width:70px;border-radius:50%}
nav a{display:block;padding:8px 10px;border-radius:14px;cursor:pointer;margin:2px 0}
nav a:hover,nav a.on{background:linear-gradient(90deg,var(--pr2),var(--pr));color:#fff}
main{margin-left:210px;padding:16px}
@media(max-width:700px){nav{position:static;width:auto;display:flex;overflow-x:auto;border:0}nav a{white-space:nowrap}nav .lg{display:none}main{margin:0}}
.card{background:var(--card);border-radius:20px;padding:14px;margin:10px 0;border:2px solid var(--bd)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.big{font-size:22px;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:7px;border-bottom:1px solid var(--bd);text-align:left}
.wrap{overflow-x:auto}.bar{background:var(--bd);border-radius:10px;height:14px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}

dialog{border:0;border-radius:24px;padding:18px;max-width:420px;width:92%;background:var(--card);color:var(--tx)}
#msgs{height:55vh;overflow:auto}.m{padding:6px 10px;margin:4px 0;border-radius:14px;background:var(--bd);width:fit-content;max-width:80%}
.m.me{background:var(--pr2);margin-left:auto}.em span{cursor:pointer;font-size:24px}
.tree ul{padding-left:22px;border-left:2px dashed var(--pr2)}.tree li{list-style:none;margin:6px 0}
.tree b{background:var(--pr2);color:#fff;padding:3px 10px;border-radius:14px}
</style></head><body>

<div id="app"><nav id="nav"></nav><main id="main"></main></div>
<dialog id="dlg"><form method="dialog" id="frm"></form></dialog>
<script>
const SB_URL='https://evpnkvgsuqqvwgsecvdt.supabase.co',SB_KEY='sb_publishable_4pKiwlCLbXPX5iojHHkkWA_P35fhwHf';

keuangan:{l:'Keuangan',i:'💰',f:[['tgl','Tanggal','date'],['tipe','Tipe','sel',['Pemasukan','Pengeluaran']],['kat','Kategori','cat'],['untuk','Untuk (anggota/motor/mobil/rumah)','text'],['jml','Jumlah','num'],['cat','Catatan','text']]},

aset:{l:'Aset & Perawatan',i:'🔧',f:[['nama','Barang','text'],['jenis','Jenis','sel',['Elektronik','Kendaraan','Perabot','Lainnya']],['beli','Tgl beli','date'],['garansi','Garansi s/d','date'],['lokasi','Lokasi','text'],['tgl','Servis berikutnya','date'],['ket','Catatan','text']]},
kontak:{l:'Kontak Darurat',i:'🚑',f:[['nama','Nama','text'],['jenis','Jenis','sel',['Darurat','Klinik/RS','Tukang','Keluarga besar']],['hp','No. HP','text'],['alamat','Alamat','text']]},
catatan:{l:'Catatan & Belanja',i:'📝',f:[['judul','Judul','text'],['jenis','Jenis','sel',['Belanjaan','Resep','Ide liburan','Memo']],['isi','Isi','area'],['st','Dicentang','chk']]},

kesehatan:{l:'Kesehatan',i:'🩺',f:[['jenis','Jenis','sel',['Menu sehat','Penyakit','Obat','Riwayat penyakit']],['nama','Nama','text'],['ket','Manfaat/Keterangan','area'],['tgl','Tanggal','date']]},
evaluasi:{l:'Evaluasi',i:'✅',f:[['tgl','Tanggal','date'],['jenis','Jenis','sel',['Problem-Solusi','Ibadah harian']],['isi','Problem / Ibadah','area'],['solusi','Solusi / Catatan','area']]},
usaha:{l:'Usaha',i:'🏪',f:[['tgl','Tanggal','date'],['nama','Usaha','text'],['jenis','Jenis','sel',['Modal','Omzet','Biaya']],['jml','Jumlah','num'],['ket','Catatan','text']]},
pengajuan:{l:'Pengajuan',i:'🙏',f:[['tgl','Tanggal','date'],['pemohon','Pemohon','sel',MEM],['butuh','Kebutuhan','text'],['jml','Estimasi','num'],['status','Status','sel',['Menunggu','Disetujui','Ditolak']]]},
profil:{l:'Profil',i:'🙂',f:[['nama','Nama','text'],['hp','No. WhatsApp (62...)','text'],['email','Email','text'],['lahir','Tgl lahir','date'],['goldar','Gol. darah','text'],['alamat','Alamat','text'],['foto','URL foto','url']]},
custom:{l:'Custom',i:'⭐',f:[['judul','Judul','text'],['tgl','Tanggal','date'],['link','Link','url'],['isi','Isi','area']]}};
const DEF=[['dash','Dashboard','🏠'],...Object.keys(M).filter(k=>k!='custom').map(k=>[k,M[k].l,M[k].i]),['chat','Chat','💬']];
let CFG={logo:'',menus:DEF.map(m=>({k:m[0],l:m[1],i:m[2]}))},CFGID=null,U=null,cur='dash',rows=[],ch=null;
const OK=!/GANTI/.test(SB_URL+SB_KEY);
function msg(t,ok){const m=$('#err');m.textContent=t;m.style.color=ok?'#3dbb8a':'#e0536b'}

async function auth(up){const e=$('#em').value.trim(),p=$('#pw').value;
 if(!OK)return msg('SB_URL / SB_KEY di index.html belum diisi.');
 if(!e||p.length<6)return msg('Isi email dan password (minimal 6 karakter).');
 msg('Memproses...',1);
 try{const r=up?await sb.auth.signUp({email:e,password:p}):await sb.auth.signInWithPassword({email:e,password:p});
  if(r.error)return msg(r.error.message);
  if(!r.data.session)return msg('Cek email untuk konfirmasi, lalu klik Masuk.',1);
  init()}catch(x){msg('Gagal terhubung: '+x.message)}}
async function lupa(){const e=$('#em').value.trim();if(!e)return msg('Isi email dulu, lalu klik Lupa password.');
 const r=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.href.split('#')[0]});msg(r.error?r.error.message:'Link reset dikirim ke email Anda.',!r.error)}
async function init(){if(!OK)return msg('SB_URL / SB_KEY di index.html belum diisi.');const{data:{session}}=await sb.auth.getSession();if(!session)return;U=session.user;
 $('#login').style.display='none';$('#app').style.display='block';
 const{data}=await sb.from('records').select('*').eq('module','_cfg').limit(1);
 if(data&&data[0]){CFGID=data[0].id;CFG=data[0].data}nav();go('dash')}
async function saveCfg(){const d={module:'_cfg',data:CFG};
 if(CFGID)await sb.from('records').update({data:CFG}).eq('id',CFGID);
 else{const r=await sb.from('records').insert(d).select();CFGID=r.data[0].id}nav()}
function nav(){$('#nav').innerHTML=`<div class="lg">${CFG.logo?`<img src="${CFG.logo}">`:'🏡'}<br>AQSHA Family</div>`+
 CFG.menus.map(m=>`<a class="${m.k==cur?'on':''}" onclick="go('${m.k}')">${esc(m.i)} ${esc(m.l)}</a>`).join('')+
 `<a onclick="go('set')">⚙️ Pengaturan</a><a onclick="sb.auth.signOut().then(()=>location.reload())">🚪 Keluar</a>`}
function modOf(k){const m=CFG.menus.find(x=>x.k==k);return M[k]||(m&&m.custom?M.custom:null)}
async function go(k){cur=k;nav();if(ch){sb.removeChannel(ch);ch=null}
 if(k=='dash')return dash();if(k=='chat')return chat();if(k=='set')return setting();
 await load();ch=sb.channel('r'+k).on('postgres_changes',{event:'*',schema:'public',table:'records'},load).subscribe()}
async function load(){const k=cur;if(!modOf(k))return;
 const{data,error}=await sb.from('records').select('*').eq('module',k).order('created_at',{ascending:false});if(error)return fail(error);rows=data||[];view()}
function cell(f,v){if(v==null||v==='')return'';if(f[2]=='url')return/^https?:/i.test(v)?`<a href="${esc(v)}" target="_blank" rel="noopener">🔗 buka</a>`:esc(v);
 if(f[2]=='num')return(+v).toLocaleString('id-ID');return esc(v)}

 let extra='';
 if(cur=='silsilah')extra=`<div class="card tree">${tree('')}</div>`;
 $('#main').innerHTML=`<h2>${esc(mm.i)} ${esc(mm.l)}</h2>
 <button class="btn" onclick="edit()">➕ Tambah</button> <button class="btn s" onclick="exp()">⬇️ Export CSV</button>
 <label class="btn s">⬆️ Import CSV<input type="file" accept=".csv" hidden onchange="imp(this.files[0])"></label>
 <button class="btn s" onclick="impUrl()">🔗 Import link</button>${extra}
 <div class="card wrap"><table><tr>${m.f.map(f=>`<th>${f[1]}</th>`).join('')}<th></th></tr>
 ${rows.map(r=>`<tr>${m.f.map(f=>f[2]=='chk'?`<td><input type="checkbox" style="width:auto" ${r.data[f[0]]?'checked':''} onchange="tog('${r.id}','${f[0]}',this.checked)"></td>`:`<td>${cell(f,r.data[f[0]])}</td>`).join('')}
 <td style="white-space:nowrap"><a href="${wa(r)}" target="_blank" title="Kirim WhatsApp">📲</a> <button class="btn s" onclick="edit('${r.id}')">✏️</button> <button class="btn d" onclick="del('${r.id}')">🗑️</button></td></tr>`).join('')}</table></div>`}
function wa(r){const t=Object.values(r.data).join(' | ');return'https://wa.me/?text='+encodeURIComponent('[AQSHA Family] '+t)}
function tree(p){const k=rows.filter(r=>(r.data.ortu||'')==p&&(p||true));if(!k.length)return'';
 return'<ul>'+k.map(r=>`<li><b>${esc(r.data.nama)}</b> <small>${esc(r.data.hub)}</small>${tree(r.data.nama)}</li>`).join('')+'</ul>'}
function inp(f,v=''){const[k,l,t,o]=f;let h=`<label>${l}</label>`;
 if(t=='sel')h+=`<select name="${k}">${o.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('')}</select>`;
 else if(t=='cat')h+=`<select name="${k}">${Object.entries(CAT).map(([g,a])=>`<optgroup label="${g}">${a.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('')}</optgroup>`).join('')}</select>`;
 else if(t=='area')h+=`<textarea name="${k}" rows="3">${esc(v)}</textarea>`;
 else if(t=='chk')h+=`<select name="${k}"><option value="">Belum</option><option value="1" ${v?'selected':''}>Sudah</option></select>`;
 else h+=`<input name="${k}" type="${t=='num'?'number':t=='url'?'url':t}" value="${esc(v)}">`;return h}
function edit(id){const m=modOf(cur),r=rows.find(x=>x.id==id),d=r?r.data:{};
 $('#frm').innerHTML=`<h3>${r?'Edit':'Tambah'}</h3>${m.f.map(f=>inp(f,d[f[0]])).join('')}
 <button class="btn" value="ok">Simpan</button> <button class="btn s" value="x">Batal</button>`;
 $('#dlg').onclose=async()=>{if($('#dlg').returnValue!='ok')return;
  const o={};new FormData($('#frm')).forEach((v,k)=>o[k]=v);

 $('#dlg').returnValue='';$('#dlg').showModal()}

 const c=[m.f.map(f=>q(f[0])).join(','),...rows.map(r=>m.f.map(f=>q(r.data[f[0]])).join(','))].join('\n');

function parse(t){const R=[];let r=[],c='',q=0;for(let i=0;i<t.length;i++){const x=t[i];
 if(q){if(x=='"'&&t[i+1]=='"'){c+='"';i++}else if(x=='"')q=0;else c+=x}
 else if(x=='"')q=1;else if(x==','){r.push(c);c=''}else if(x=='\n'){r.push(c);R.push(r);r=[];c=''}else if(x!='\r')c+=x}
 if(c||r.length){r.push(c);R.push(r)}return R}

async function dash(){try{const td=today(),ym=td.slice(0,7);
 const g=async k=>{const r=await sb.from('records').select('data').eq('module',k);if(r.error)throw r.error;return r.data.map(x=>x.data)};
 const[kw,ag,kl,as]=await Promise.all([g('keuangan'),g('anggaran'),g('kalender'),g('aset')]);
 const bln=kw.filter(x=>(x.tgl||'').startsWith(ym)),pm=bln.filter(x=>x.tipe=='Pemasukan').reduce((a,x)=>a+ +x.jml,0);

 const col=['#ff7a59','#ffb86b','#3dbb8a','#6aa5ff','#c78bff'];let a=0;
 const stops=Object.values(grp).map((v,i)=>{const s=a;a+=v/pk*100;return`${col[i%5]} ${s}% ${a}%`}).join(',');
 const spent=k=>ex.filter(x=>x.kat==k).reduce((s,x)=>s+ +x.jml,0);
 const soon=[...kl.map(x=>[x.tgl,'📅 '+esc(x.judul)]),...as.map(x=>[x.tgl,'🔧 Servis '+esc(x.nama)])].filter(x=>x[0]&&x[0]>=td).sort().slice(0,8);
 $('#main').innerHTML=`<h2>🏠 Halo, Keluarga AQSHA! 🐣</h2><div class="grid">
 <div class="card">Pemasukan bulan ini<div class="big" style="color:var(--ok)">${rp(pm)}</div></div>
 <div class="card">Pengeluaran<div class="big" style="color:#e0536b">${rp(pk)}</div></div>
 <div class="card">Sisa<div class="big">${rp(pm-pk)}</div></div></div>
 <div class="grid"><div class="card"><b>Pengeluaran per kelompok</b><br>${pk?`<div class="pie" style="background:conic-gradient(${stops})"></div>`:'Belum ada data'}
 <br>${Object.entries(grp).map(([k,v],i)=>`<span style="color:${col[i%5]}">●</span> ${k}: ${rp(v)}<br>`).join('')}</div>
 <div class="card"><b>Anggaran vs realisasi</b>${ag.map(x=>{const s=spent(x.kat),p=Math.min(100,+x.jml?s/x.jml*100:0);return`<p>${x.kat}: ${rp(s)} / ${rp(x.jml)}<div class="bar"><i style="width:${p}%;background:${p>90?'#e0536b':'var(--ok)'}"></i></div></p>`}).join('')||'<p>Isi menu Anggaran dulu</p>'}</div>
 <div class="card"><b>Pengingat terdekat</b>${soon.map(x=>`<p>${x[0]} — ${x[1]}</p>`).join('')||'<p>Tidak ada</p>'}</div></div>`}catch(e){fail(e)}}

 <input type="file" accept="image/*" onchange="logo(this.files[0])"></div>
 <div class="card"><b>Menu</b><div class="wrap"><table>${CFG.menus.map((m,i)=>`<tr><td>${esc(m.i)}</td><td>${esc(m.l)}</td><td><button class="btn s" onclick="renm(${i})">✏️</button> <button class="btn d" onclick="rmm(${i})">🗑️</button></td></tr>`).join('')}</table></div>
 <button class="btn" onclick="addm()">➕ Tambah menu</button> <button class="btn s" onclick="CFG.menus=DEF.map(m=>({k:m[0],l:m[1],i:m[2]}));saveCfg().then(setting)">Reset</button></div>`}
function logo(f){if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,128/Math.max(i.width,i.height));c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);CFG.logo=c.toDataURL('image/png');saveCfg().then(setting)};i.src=r.result};r.readAsDataURL(f)}
function renm(i){const l=prompt('Nama menu',CFG.menus[i].l),e=prompt('Ikon (emoji)',CFG.menus[i].i);if(l){CFG.menus[i].l=l;CFG.menus[i].i=e||CFG.menus[i].i;saveCfg().then(setting)}}
function rmm(i){if(confirm('Hapus menu dari navigasi? (data tetap tersimpan)')){CFG.menus.splice(i,1);saveCfg().then(setting)}}
function addm(){const l=prompt('Nama menu baru');if(l){CFG.menus.push({k:'c_'+Date.now(),l,i:prompt('Ikon (emoji)','⭐')||'⭐',custom:1});saveCfg().then(setting)}}
sb.auth.onAuthStateChange(ev=>{if(ev=='PASSWORD_RECOVERY')setTimeout(async()=>{const p=prompt('Password baru (min. 6 karakter):');if(p&&p.length>=6){const r=await sb.auth.updateUser({password:p});alert(r.error?r.error.message:'Password diganti.')}init()},0)});
init();
</script></body></html>
