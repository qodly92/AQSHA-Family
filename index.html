function fm(p,d){return CFG.menus.filter(m=>m.p==p).map(m=>{const i=CFG.menus.indexOf(m);return`<tr><td style="padding-left:${d*18}px">${esc(m.i)} ${esc(m.l)} ${isG(m.k)?'📂':''}</td><td><button class="btn s" onclick="renm(${i})">✏️</button> <button class="btn d" onclick="rmm(${i})">🗑️</button></td></tr>`+fm(m.k,d+1)}).join('')}
async function setting(){PS=(await sb.from('profiles').select('*').order('created_at')).data||[];
 $('#main').innerHTML=`<h2>⚙️ Setting General (Super Admin)</h2><div class="card"><b>Logo & tema warna</b><br>${CFG.logo?`<img src="${CFG.logo}" width="64"><br>`:''}<input type="file" accept="image/*" onchange="logo(this.files[0])">
 <br>${Object.entries(TH).map(([k,v])=>`<span class="sw ${CFG.theme==k?'on':''}" title="${v[0]}" style="background:linear-gradient(135deg,${v[1]} 50%,${v[2]} 50%)" onclick="setTheme('${k}')"></span>`).join('')}<br><label>Atau warna sendiri</label><input type="color" value="${CFG.color||'#ff7a59'}" onchange="CFG.theme='';CFG.color=this.value;saveCfg().then(saveLg)"></div>
 <div class="card"><b>Laman Login</b><label>Judul</label><input id="l1" value="${esc(LG.t)}"><label>Sub judul</label><input id="l2" value="${esc(LG.s)}"><label>Emoji maskot (jika tanpa logo)</label><input id="l3" value="${esc(LG.e)}"><label>Warna latar 1 dan 2</label><input type="color" id="l4" value="${LG.c1||'#ffd9a8'}"><input type="color" id="l5" value="${LG.c2||'#ffb3a1'}"><button class="btn" onclick="lgSave()">Simpan laman login</button> <button class="btn s" onclick="lgSave(1)">Reset warna</button></div>
 <div class="card"><b>Pengguna</b> <small>(akun baru yang mendaftar sendiri berstatus "Menunggu persetujuan")</small><div class="wrap"><table>${PS.map(p=>`<tr><td>${esc(p.nama)}<br><small>${esc(p.email)}</small></td><td>${esc(p.hp||'')}</td><td><select onchange="setRole('${p.id}',this.value)">${Object.keys(RL).map(r=>`<option value="${r}" ${r==p.role?'selected':''}>${RL[r]}</option>`).join('')}</select></td><td style="white-space:nowrap"><button class="btn s" onclick="edU('${p.id}')">✏️</button>${p.id!=U.id?` <button class="btn d" onclick="delU('${p.id}')">🗑️</button>`:''}</td></tr>`).join('')}</table></div><button class="btn" onclick="addU()">➕ Tambah user</button></div>
 <div class="card"><b>Menu</b><div class="wrap"><table>${fm('',0)}</table></div><button class="btn" onclick="addm()">➕ Tambah menu</button> <button class="btn s" onclick="if(confirm('Kembalikan menu awal?')){CFG.menus=DEF;saveCfg().then(setting)}">Reset menu</button></div>`}
async function setRole(id,r){const e=(await sb.from('profiles').update({role:r}).eq('id',id)).error;if(e)alert(e.message)}
async function edU(id){const p=PS.find(x=>x.id==id),n=prompt('Nama',p.nama);if(!n)return;const h=prompt('No. WhatsApp (62812...)',p.hp||'');await sb.from('profiles').update({nama:n,hp:h}).eq('id',id);setting()}
async function delU(id){if(confirm('Hapus pengguna ini? Ia tidak bisa lagi mengakses data.')){await sb.from('profiles').delete().eq('id',id);setting()}}
async function addU(){const email=prompt('Email'),pw=email&&prompt('Password (min. 6)');if(!pw)return;const nama=prompt('Nama')||email,hp=prompt('No. WhatsApp (62812...)')||'',role=prompt('Peran: ayah / ibu / anak','anak');
 const t=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}}),r=await t.auth.signUp({email,password:pw,options:{data:{nama,hp}}});if(r.error)return alert(r.error.message);
 setTimeout(async()=>{await sb.from('profiles').update({role:RLT[role]?role:'anak',hp,nama}).eq('id',r.data.user.id);setting()},900)}
function renm(i){const m=CFG.menus[i],l=prompt('Nama menu',m.l);if(!l)return;m.l=l;m.i=prompt('Ikon (emoji)',m.i)||m.i;saveCfg().then(setting)}
function rmm(i){if(!confirm('Hapus menu ini beserta submenunya dari navigasi? (data tetap tersimpan)'))return;const k=CFG.menus[i].k,d=new Set([k]);let n;do{n=d.size;CFG.menus.forEach(m=>d.has(m.p)&&d.add(m.k))}while(d.size>n);CFG.menus=CFG.menus.filter(m=>!d.has(m.k));saveCfg().then(setting)}
function addm(){const gs=CFG.menus.filter(m=>isG(m.k)),l=prompt('Nama menu baru');if(!l)return;const i=prompt('Ikon (emoji)','⭐')||'⭐',s=prompt('Masuk ke induk nomor berapa? (kosong = menu utama)\n'+gs.map((g,x)=>(x+1)+'. '+g.l).join('\n')),p=gs[s-1]?gs[s-1].k:'';
 CFG.menus.push({k:(confirm('Jadikan folder/grup (punya submenu)? OK = ya, Batal = menu biasa')?'g':'c_')+Date.now(),l,i,p});saveCfg().then(setting)}
function logo(f){if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,128/Math.max(i.width,i.height));c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);CFG.logo=c.toDataURL('image/png');saveCfg().then(()=>{saveLg();setting()})};i.src=r.result};r.readAsDataURL(f)}
const TH={oranye:['Oranye Ceria','#ff7a59','#ffd9a8','#fff7ec','#f1e2cf'],putih:['Putih Bersih','#4b8bf5','#ffd54f','#ffffff','#e6ebf2'],langit:['Biru Langit','#38a3e8','#ffe066','#eaf6ff','#cfe8fb'],hijau:['Hijau Segar','#3dbb8a','#ffe066','#eefaf3','#cdeedd'],kuning:['Kuning Cerah','#f5b301','#7fd1f7','#fffbe6','#f6e9a8'],pink:['Pink Permen','#f06292','#8fd3f4','#fff0f5','#f8cfdc'],ungu:['Ungu Lavender','#9b6cf0','#a8e6cf','#f4eeff','#e0d3fb']};
function applyTheme(t,c){const r=document.documentElement.style,x=TH[t],dk=matchMedia('(prefers-color-scheme:dark)').matches;
 if(x){r.setProperty('--pr',x[1]);r.setProperty('--pr2',x[2]);if(!dk){r.setProperty('--bg',x[3]);r.setProperty('--bd',x[4])}}
 else{r.setProperty('--pr',c||'#ff7a59');['--pr2','--bg','--bd'].forEach(v=>r.removeProperty(v))}
 const m=document.querySelector('meta[name=theme-color]');m&&m.setAttribute('content',x?x[1]:c||'#ff7a59')}
async function setTheme(k){CFG.theme=k;await saveCfg();await saveLg();setting()}
function applyLogin(){$('#lt').textContent=LG.t;$('#ls').textContent=LG.s;$('#le').innerHTML=LG.logo?`<img src="${esc(LG.logo)}" width="72" style="border-radius:50%">`:esc(LG.e);$('#login').style.background=LG.c1&&LG.c2?`linear-gradient(135deg,${LG.c1},${LG.c2})`:''}
async function saveLg(){LG.logo=CFG.logo||'';LG.theme=CFG.theme||'';const e=(await sb.from('app_public').upsert({id:1,data:LG})).error;if(e)alert(e.message)}
async function lgSave(rs){if(rs)LG.c1=LG.c2='';else{LG.t=$('#l1').value;LG.s=$('#l2').value;LG.e=$('#l3').value;LG.c1=$('#l4').value;LG.c2=$('#l5').value}await saveLg();applyLogin();setting()}
let DP;addEventListener('beforeinstallprompt',e=>{e.preventDefault();DP=e;$('#inst').style.display='flex'});
function inst(){DP&&DP.prompt();DP=null;$('#inst').style.display='none'}
if(/iphone|ipad/i.test(navigator.userAgent)&&!navigator.standalone){$('#it').textContent='📲 Pasang: di Safari ketuk Bagikan lalu "Tambah ke Layar Utama".';$('#ib').style.display='none';$('#inst').style.display='flex'}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
sb.auth.onAuthStateChange(ev=>{if(ev=='PASSWORD_RECOVERY')setTimeout(async()=>{const p=prompt('Password baru (min. 6 karakter):');if(p&&p.length>=6){const r=await sb.auth.updateUser({password:p});alert(r.error?r.error.message:'Password diganti.')}init()},0)});
OK&&sb.from('app_public').select('data').eq('id',1).maybeSingle().then(r=>{if(r.data&&r.data.data)LG={...LG,...r.data.data};if(LG.theme)applyTheme(LG.theme);applyLogin()});
init();
</script></body></html>
